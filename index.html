<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamus Pasal — Hukum Pidana Indonesia</title>
  <meta name="description" content="Cari pasal KUHP baru, KUHAP baru, dan UU Penyesuaian Pidana." />
  <link rel="manifest" href="/katapasal/manifest.json" />
  <meta name="theme-color" content="#e8eaf0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="/katapasal/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="/katapasal/style.css" />
</head>
<body>
  <header class="topnav" id="topnav">
    <div class="topnav-inner">
      <a href="#/" class="topnav-logo"><span class="material-symbols-outlined">menu_book</span> Kamus Pasal</a>
      <div class="topnav-search" id="top-search">
        <span class="material-symbols-outlined">search</span>
        <input type="search" id="q" placeholder="Cari pasal..." autocomplete="off" />
        <button id="clear" class="topnav-clear" hidden><span class="material-symbols-outlined">close</span></button>
      </div>
      <button id="dark-toggle" class="neu-btn-icon" title="Ganti tema"><span class="material-symbols-outlined">dark_mode</span></button>
    </div>
  </header>
  <main id="app"></main>
  <footer class="site-footer">
    <p><span class="material-symbols-outlined" style="vertical-align:middle">menu_book</span> <strong>Kamus Pasal</strong></p>
    <p>Referensi edukatif. Bukan pengganti konsultasi hukum. Verifikasi teks resmi di <a href="https://peraturan.bpk.go.id" target="_blank">JDIH BPK</a>.</p>
    <p>&copy; 2026 Kamus Pasal</p>
  </footer>
  <nav class="bottomnav" id="bottomnav">
    <button class="bn-btn active" data-tab="home"><span class="material-symbols-outlined">search</span><span>Cari</span></button>
    <button class="bn-btn" data-tab="bab"><span class="material-symbols-outlined">book</span><span>BAB</span></button>
    <button class="bn-btn" data-tab="bm"><span class="material-symbols-outlined">bookmark</span><span>Bookmark</span></button>
  </nav>
  <div id="bm-panel" class="bm-panel">
    <div class="bm-sheet">
      <div class="bm-head"><h2>Bookmark (<span id="bm-count">0</span>)</h2><button id="close-bm"><span class="material-symbols-outlined">close</span></button></div>
      <div id="bm-list"></div>
    </div>
  </div>
  <script src="/katapasal/app.v5.js"></script>
</body>
</html>
